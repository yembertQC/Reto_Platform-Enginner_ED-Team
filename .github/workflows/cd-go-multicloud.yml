name: CD Go Multi-Cloud Manual (Serverless)

# Construye una sola vez y despliega en paralelo en las dos nubes, sin registry en ninguna:
#   Azure -> Azure Container Apps, con la imagen publicada en GitHub Container Registry (GHCR)
#   AWS   -> AWS Lambda, con el binario "bootstrap" en un zip + Lambda Web Adapter como layer (Function URL)
# Usa el mismo paquete de GHCR que cd-go.yml (<CONTAINER_NAME>-go), que debe ser público.

on:
  workflow_dispatch:

# Sin permisos por defecto: cada job declara solo los que necesita
permissions: {}

env:
  # Azure
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  CONTAINER_NAME_GO: ${{ vars.CONTAINER_NAME }}-go
  CONTAINERAPP_ENV_NAME: ${{ vars.CONTAINERAPP_ENV_NAME }}

  # AWS
  AWS_REGION: ${{ vars.AWS_REGION }}
  LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_NAME }}-go
  LAMBDA_ROLE_NAME: ${{ vars.LAMBDA_NAME }}-lambda-role

jobs:
  build_once:
    permissions:
      contents: read
      packages: write
    name: Build Once (GHCR + zip)
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.sha.outputs.short_sha }}
      ghcr-image: ${{ steps.meta.outputs.image }}
      ghcr-digest: ${{ steps.build_push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.23"
          cache-dependency-path: src-go/go.mod

      - name: Run tests
        working-directory: src-go
        run: go test -v -race ./...

      - name: Short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        # GHCR exige el owner en minúsculas
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ env.CONTAINER_NAME_GO }}" >> "$GITHUB_OUTPUT"

      # --- Imagen para Azure Container Apps ---
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        id: build_push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./src-go
          file: ./src-go/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.sha.outputs.short_sha }}
          # Enlaza el paquete con este repo
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          platforms: linux/amd64
          provenance: false
          sbom: false

      # --- Paquete zip para AWS Lambda ---
      - name: Build Lambda package
        working-directory: src-go
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../build/bootstrap .
          (cd ../build && zip -q ../lambda-go.zip bootstrap)
          ls -lh ../lambda-go.zip

      - name: Upload Lambda package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lambda-go
          path: lambda-go.zip
          retention-days: 7

  release:
    permissions:
      contents: write
    name: Create Release Tag
    runs-on: ubuntu-latest
    needs: build_once
    outputs:
      release-tag: ${{ steps.create_release.outputs.tag_name }}

    steps:
      - name: Generate release tag
        id: tag_version
        run: |
          TAG="go-mc-v$(date +'%Y%m%d')-${{ needs.build_once.outputs.short-sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag_version.outputs.tag }}
          # Los datos van por env (no interpolados en el script) para evitar inyección
          NOTES: |
              ## Multi-Cloud Go Deployment

              - Release: `${{ steps.tag_version.outputs.tag }}`
              - Imagen (Azure): `${{ needs.build_once.outputs.ghcr-image }}@${{ needs.build_once.outputs.ghcr-digest }}`
              - Paquete (AWS): `lambda-go.zip` (provided.al2023)
              - Commit: `${{ github.sha }}`
              - Triggered by: `${{ github.actor }}`
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Release Go MultiCloud $TAG" \
            --notes "$NOTES" \
            --generate-notes
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  deploy_azure:
    permissions:
      contents: read
    name: Deploy Go in Azure Container Apps
    runs-on: ubuntu-latest
    needs: [build_once, release]
    outputs:
      app_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure Login
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        id: deploy
        run: |
          # Por digest: Azure despliega exactamente la imagen construida en este run
          bash scripts/deploy-containerapp.sh \
            "${{ env.CONTAINER_NAME_GO }}" \
            "${{ env.RESOURCE_GROUP }}" \
            "${{ env.CONTAINERAPP_ENV_NAME }}" \
            "${{ needs.build_once.outputs.ghcr-image }}@${{ needs.build_once.outputs.ghcr-digest }}" \
            8080

      - name: Smoke test
        run: bash scripts/smoke-test.sh "${{ steps.deploy.outputs.url }}"

  deploy_aws:
    permissions:
      contents: read
    name: Deploy Go in AWS Lambda
    runs-on: ubuntu-latest
    needs: [build_once, release]
    outputs:
      app_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download Lambda package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lambda-go

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to AWS Lambda
        id: deploy
        run: |
          bash scripts/deploy-lambda.sh \
            "${{ env.LAMBDA_FUNCTION_NAME }}" \
            lambda-go.zip \
            "${{ env.LAMBDA_ROLE_NAME }}" \
            provided.al2023 \
            bootstrap \
            8080

      - name: Smoke test
        run: bash scripts/smoke-test.sh "${{ steps.deploy.outputs.url }}"

  final_summary:
    permissions: {}
    name: Final Multi-Cloud Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [build_once, release, deploy_azure, deploy_aws]

    steps:
      - name: Publish unified summary
        run: |
          echo "## Multi-Cloud Deployment Summary (Go)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release tag: \`${{ needs.release.outputs.release-tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Imagen GHCR (Azure): \`${{ needs.build_once.outputs.ghcr-image }}@${{ needs.build_once.outputs.ghcr-digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Paquete zip (AWS): \`lambda-go.zip\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Pipeline Status" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Azure | AWS |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ needs.build_once.result }} | ${{ needs.build_once.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release | ${{ needs.release.result }} | ${{ needs.release.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | ${{ needs.deploy_azure.result }} | ${{ needs.deploy_aws.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### URLs de acceso" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cloud | Servicio | App URL | Health URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|----------|---------|------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Azure | Container Apps | ${{ needs.deploy_azure.outputs.app_url || 'pending' }}/ | ${{ needs.deploy_azure.outputs.app_url || 'pending' }}/health |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AWS | Lambda (Function URL) | ${{ needs.deploy_aws.outputs.app_url || 'pending' }}/ | ${{ needs.deploy_aws.outputs.app_url || 'pending' }}/health |" >> "$GITHUB_STEP_SUMMARY"
