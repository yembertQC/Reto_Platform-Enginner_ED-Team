name: CD Go Multi-Cloud Manual (Serverless)

# Construye la imagen una sola vez (GHCR), la promueve a ACR y ECR, y despliega en paralelo:
#   Azure -> Azure Container Apps
#   AWS   -> AWS Lambda (imagen de contenedor + Lambda Web Adapter, Function URL)

on:
  workflow_dispatch:

# Sin permisos por defecto: cada job declara solo los que necesita
permissions: {}

env:
  # Azure
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  REGISTRY_NAME: ${{ vars.REGISTRY_NAME }}
  CONTAINER_NAME_GO: ${{ vars.CONTAINER_NAME }}-go
  CONTAINERAPP_ENV_NAME: ${{ vars.CONTAINERAPP_ENV_NAME }}

  # AWS
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY_NAME: ${{ vars.ECR_REPOSITORY_NAME }}-go
  LAMBDA_FUNCTION_NAME: ${{ vars.ECR_REPOSITORY_NAME }}-go
  LAMBDA_ROLE_NAME: ${{ vars.ECR_REPOSITORY_NAME }}-lambda-role

  # Temporary image in GHCR
  GHCR_IMAGE_NAME: ed-team-app-go-multicloud

jobs:
  build_once:
    permissions:
      contents: read
      packages: write
    name: Build Once (GHCR temp)
    runs-on: ubuntu-latest
    outputs:
      short-sha: ${{ steps.sha.outputs.short_sha }}
      ghcr-owner-lc: ${{ steps.owner.outputs.owner_lc }}
      ghcr-tag: ${{ steps.meta.outputs.tag }}
      ghcr-image: ${{ steps.meta.outputs.image }}
      ghcr-digest: ${{ steps.build_push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.23"
          cache-dependency-path: src-go/go.mod

      - name: Run tests
        working-directory: src-go
        run: go test -v -race ./...

      - name: Short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute GHCR metadata
        id: owner
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build metadata
        id: meta
        run: |
          TAG="mc-${{ github.run_id }}-${{ steps.sha.outputs.short_sha }}"
          IMAGE="ghcr.io/${{ steps.owner.outputs.owner_lc }}/${{ env.GHCR_IMAGE_NAME }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push temporary image to GHCR
        id: build_push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./src-go
          file: ./src-go/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          # Lambda exige linux/amd64 de un solo manifiesto (sin attestations)
          platforms: linux/amd64
          provenance: false
          sbom: false

  promote_azure:
    permissions:
      packages: read
    name: Promote Image to ACR
    runs-on: ubuntu-latest
    needs: build_once
    outputs:
      azure-image: ${{ steps.push.outputs.azure_image }}

    steps:
      - name: Azure Login
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ACR
        run: az acr login --name "${{ env.REGISTRY_NAME }}"

      - name: Pull from GHCR and push to ACR
        id: push
        run: |
          SOURCE_IMAGE="${{ needs.build_once.outputs.ghcr-image }}@${{ needs.build_once.outputs.ghcr-digest }}"
          TARGET_IMAGE="${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.CONTAINER_NAME_GO }}:${{ needs.build_once.outputs.short-sha }}"

          docker pull "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"

          echo "azure_image=$TARGET_IMAGE" >> "$GITHUB_OUTPUT"

  promote_aws:
    permissions:
      packages: read
    name: Promote Image to ECR
    runs-on: ubuntu-latest
    needs: build_once
    outputs:
      aws-image: ${{ steps.push.outputs.aws_image }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY_NAME }}" --region "${{ env.AWS_REGION }}" 2>/dev/null || \
          aws ecr create-repository --repository-name "${{ env.ECR_REPOSITORY_NAME }}" --region "${{ env.AWS_REGION }}"

      - name: Pull from GHCR and push to ECR
        id: push
        run: |
          AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          SOURCE_IMAGE="${{ needs.build_once.outputs.ghcr-image }}@${{ needs.build_once.outputs.ghcr-digest }}"
          TARGET_IMAGE="${ECR_REGISTRY}/${{ env.ECR_REPOSITORY_NAME }}:${{ needs.build_once.outputs.short-sha }}"

          docker pull "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"

          echo "aws_image=$TARGET_IMAGE" >> "$GITHUB_OUTPUT"

  release:
    permissions:
      contents: write
    name: Create Release Tag
    runs-on: ubuntu-latest
    needs: build_once
    outputs:
      release-tag: ${{ steps.create_release.outputs.tag_name }}

    steps:
      - name: Generate release tag
        id: tag_version
        run: |
          TAG="go-mc-v$(date +'%Y%m%d')-${{ needs.build_once.outputs.short-sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag_version.outputs.tag }}
          # Los datos van por env (no interpolados en el script) para evitar inyección
          NOTES: |
              ## Multi-Cloud Go Deployment

              - Release: `${{ steps.tag_version.outputs.tag }}`
              - GHCR temp image: `${{ needs.build_once.outputs.ghcr-image }}:${{ needs.build_once.outputs.ghcr-tag }}`
              - Digest: `${{ needs.build_once.outputs.ghcr-digest }}`
              - Commit: `${{ github.sha }}`
              - Triggered by: `${{ github.actor }}`
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Release Go MultiCloud $TAG" \
            --notes "$NOTES" \
            --generate-notes
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  deploy_azure:
    permissions:
      contents: read
    name: Deploy Go in Azure Container Apps
    runs-on: ubuntu-latest
    needs: [promote_azure, release]
    outputs:
      app_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure Login
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        id: deploy
        run: |
          bash scripts/deploy-containerapp.sh \
            "${{ env.CONTAINER_NAME_GO }}" \
            "${{ env.RESOURCE_GROUP }}" \
            "${{ env.CONTAINERAPP_ENV_NAME }}" \
            "${{ needs.promote_azure.outputs.azure-image }}" \
            "${{ env.REGISTRY_NAME }}" \
            8080

      - name: Smoke test
        run: bash scripts/smoke-test.sh "${{ steps.deploy.outputs.url }}"

  deploy_aws:
    permissions:
      contents: read
    name: Deploy Go in AWS Lambda
    runs-on: ubuntu-latest
    needs: [promote_aws, release]
    outputs:
      app_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to AWS Lambda
        id: deploy
        run: |
          bash scripts/deploy-lambda.sh \
            "${{ env.LAMBDA_FUNCTION_NAME }}" \
            "${{ needs.promote_aws.outputs.aws-image }}" \
            "${{ env.LAMBDA_ROLE_NAME }}"

      - name: Smoke test
        run: bash scripts/smoke-test.sh "${{ steps.deploy.outputs.url }}"

  cleanup_ghcr:
    name: Cleanup GHCR Temp Image
    runs-on: ubuntu-latest
    needs: [build_once, promote_azure, promote_aws, release, deploy_azure, deploy_aws]
    if: always()
    permissions:
      contents: read
      packages: write
    outputs:
      cleanup-status: ${{ steps.cleanup.outputs.cleanup_status }}
      cleanup-note: ${{ steps.cleanup.outputs.cleanup_note }}

    steps:
      - name: Delete temporary GHCR image tag
        id: cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ env.GHCR_IMAGE_NAME }}
          TARGET_TAG: ${{ needs.build_once.outputs.ghcr-tag }}
        run: |
          set +e

          # Detect if owner is org or user and use the correct API scope
          OWNER="${{ github.repository_owner }}"
          TYPE=$(gh api "users/$OWNER" --jq '.type' 2>/dev/null || echo "User")
          if [ "$TYPE" = "Organization" ]; then
            SCOPE="orgs/$OWNER"
          else
            SCOPE="user"
          fi

          # List versions and find the one with our tag
          VERSION_ID=$(gh api "$SCOPE/packages/container/$PACKAGE_NAME/versions" --paginate --jq \
            ".[] | select(any(.metadata.container.tags[]?; . == \"$TARGET_TAG\")) | .id" 2>/dev/null | head -n1)

          if [ -z "$VERSION_ID" ] || [ "$VERSION_ID" = "null" ]; then
            echo "cleanup_status=not-found" >> "$GITHUB_OUTPUT"
            echo "cleanup_note=No se encontro el tag temporal en GHCR (posiblemente ya fue eliminado)." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Delete the version
          if gh api --method DELETE "$SCOPE/packages/container/$PACKAGE_NAME/versions/$VERSION_ID" 2>/dev/null; then
            echo "cleanup_status=deleted" >> "$GITHUB_OUTPUT"
            echo "cleanup_note=Tag temporal eliminado en GHCR." >> "$GITHUB_OUTPUT"
          else
            echo "cleanup_status=failed" >> "$GITHUB_OUTPUT"
            echo "cleanup_note=No se pudo eliminar en GHCR (puede requerir PAT con delete:packages)." >> "$GITHUB_OUTPUT"
          fi

  final_summary:
    permissions: {}
    name: Final Multi-Cloud Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [
      build_once,
      promote_azure,
      promote_aws,
      release,
      deploy_azure,
      deploy_aws,
      cleanup_ghcr
    ]

    steps:
      - name: Publish unified summary
        run: |
          echo "## Multi-Cloud Deployment Summary (Go)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Build Artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release tag: \`${{ needs.release.outputs.release-tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GHCR temp image: \`${{ needs.build_once.outputs.ghcr-image }}:${{ needs.build_once.outputs.ghcr-tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ needs.build_once.outputs.ghcr-digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Pipeline Status" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Azure | AWS |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release | ${{ needs.release.result }} | ${{ needs.release.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Promote image | ${{ needs.promote_azure.result }} | ${{ needs.promote_aws.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy | ${{ needs.deploy_azure.result }} | ${{ needs.deploy_aws.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### URLs de acceso" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cloud | Servicio | App URL | Health URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|----------|---------|------------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Azure | Container Apps | ${{ needs.deploy_azure.outputs.app_url || 'pending' }}/ | ${{ needs.deploy_azure.outputs.app_url || 'pending' }}/health |" >> "$GITHUB_STEP_SUMMARY"
          echo "| AWS | Lambda (Function URL) | ${{ needs.deploy_aws.outputs.app_url || 'pending' }}/ | ${{ needs.deploy_aws.outputs.app_url || 'pending' }}/health |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### GHCR Cleanup" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: **${{ needs.cleanup_ghcr.outputs.cleanup-status }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Detail: ${{ needs.cleanup_ghcr.outputs.cleanup-note }}" >> "$GITHUB_STEP_SUMMARY"
