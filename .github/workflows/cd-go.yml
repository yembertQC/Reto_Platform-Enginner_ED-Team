name: CD - Go (Serverless)

# Azure -> Azure Container Apps con la imagen en GitHub Container Registry (GHCR), escala a cero.
# AWS   -> AWS Lambda con paquete zip (binario "bootstrap", runtime provided.al2023) + Lambda Web Adapter como layer, Function URL.
# Ninguno de los dos necesita un registry en la nube (ni ACR ni ECR).
# El cloud destino lo decide la variable de repositorio CLOUD_PROVIDER.

on:
  workflow_dispatch:
  push:
    paths:
      - 'src-go/**'
    branches: [ main ]

# Sin permisos por defecto: cada job declara solo los que necesita
permissions: {}

env:
  CLOUD_PROVIDER: ${{ vars.CLOUD_PROVIDER }}
  # Azure
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  CONTAINER_NAME_GO: ${{ vars.CONTAINER_NAME }}-go
  CONTAINERAPP_ENV_NAME: ${{ vars.CONTAINERAPP_ENV_NAME }}
  # AWS
  AWS_REGION: ${{ vars.AWS_REGION }}
  LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_NAME }}-go
  LAMBDA_ROLE_NAME: ${{ vars.LAMBDA_NAME }}-lambda-role

jobs:
  build:
    permissions:
      contents: read
      packages: write   # publicar la imagen en GHCR (solo se usa con CLOUD_PROVIDER=azure)
    name: Build
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact_info.outputs.artifact }}
      sha-short: ${{ steps.sha_short.outputs.sha_short }}

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Validate CLOUD_PROVIDER
      run: |
        case "${{ env.CLOUD_PROVIDER }}" in
          azure|aws) echo "Cloud destino: ${{ env.CLOUD_PROVIDER }}" ;;
          *) echo "❌ CLOUD_PROVIDER debe ser 'azure' o 'aws' (valor actual: '${{ env.CLOUD_PROVIDER }}')"; exit 1 ;;
        esac

    - name: Setup Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.23'
        cache-dependency-path: src-go/go.mod

    - name: Run tests
      working-directory: src-go
      run: go test -v -race ./...

    - name: Set SHA Short
      id: sha_short
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # --- Azure: imagen en GHCR (se autentica con GITHUB_TOKEN, sin secretos de la nube) ---
    - name: Login to GHCR
      if: env.CLOUD_PROVIDER == 'azure'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image to GHCR
      if: env.CLOUD_PROVIDER == 'azure'
      run: |
        # GHCR exige el owner en minúsculas
        IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ env.CONTAINER_NAME_GO }}:${{ steps.sha_short.outputs.sha_short }}"
        # linux/amd64 de un solo manifiesto; la etiqueta source enlaza el paquete con este repo
        docker build --platform linux/amd64 --provenance=false --sbom=false \
          --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
          -f src-go/Dockerfile -t "$IMAGE" src-go/
        docker push "$IMAGE"
        echo "ARTIFACT=$IMAGE" >> $GITHUB_ENV
        echo "✅ Image built and pushed: $IMAGE"

    # --- AWS: binario "bootstrap" en un zip para Lambda (sin imagen ni ECR) ---
    - name: Build Lambda package
      if: env.CLOUD_PROVIDER == 'aws'
      working-directory: src-go
      run: |
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../build/bootstrap .
        (cd ../build && zip -q ../lambda-go.zip bootstrap)
        ls -lh ../lambda-go.zip
        echo "ARTIFACT=lambda-go.zip (AWS Lambda provided.al2023)" >> $GITHUB_ENV

    - name: Upload Lambda package
      if: env.CLOUD_PROVIDER == 'aws'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: lambda-go
        path: lambda-go.zip
        retention-days: 7

    - name: Set artifact output
      id: artifact_info
      run: echo "artifact=$ARTIFACT" >> $GITHUB_OUTPUT

  release:
    permissions:
      contents: write
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    outputs:
      release-tag: ${{ steps.create_release.outputs.tag_name }}

    steps:
    - name: Generate release tag
      id: tag_version
      run: |
        TAG="go-v$(date +'%Y%m%d')-${{ needs.build.outputs.sha-short }}"
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Generated release tag: $TAG"

    - name: Create GitHub Release
      id: create_release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.tag_version.outputs.tag }}
        # Los datos van por env (no interpolados en el script) para evitar inyección
        NOTES: |
            ## 🚀 Reto Platform Engineering · Despliegue Go (Serverless)

            ### Build Information:
            - **Artifact**: `${{ needs.build.outputs.artifact }}`
            - **Commit**: ${{ github.sha }}
            - **Short SHA**: ${{ needs.build.outputs.sha-short }}
            - **Author**: ${{ github.actor }}
            - **Cloud Provider**: ${{ env.CLOUD_PROVIDER }}

            ### Links:
            - [Commit Details](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - [Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
      run: |
        gh release create "$TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "Release Go $TAG" \
          --notes "$NOTES" \
          --generate-notes
        echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    permissions:
      contents: read
    name: Deploy (Serverless)
    needs: [build, release]
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    # --- Azure Container Apps (imagen pública de GHCR) ---
    - name: Azure Login
      if: env.CLOUD_PROVIDER == 'azure'
      uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Container Apps
      if: env.CLOUD_PROVIDER == 'azure'
      id: deploy_azure
      run: |
        bash scripts/deploy-containerapp.sh \
          "${{ env.CONTAINER_NAME_GO }}" \
          "${{ env.RESOURCE_GROUP }}" \
          "${{ env.CONTAINERAPP_ENV_NAME }}" \
          "${{ needs.build.outputs.artifact }}" \
          8080

    # --- AWS Lambda (zip) ---
    - name: Download Lambda package
      if: env.CLOUD_PROVIDER == 'aws'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: lambda-go

    - name: Configure AWS Credentials
      if: env.CLOUD_PROVIDER == 'aws'
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy to AWS Lambda
      if: env.CLOUD_PROVIDER == 'aws'
      id: deploy_aws
      run: |
        bash scripts/deploy-lambda.sh \
          "${{ env.LAMBDA_FUNCTION_NAME }}" \
          lambda-go.zip \
          "${{ env.LAMBDA_ROLE_NAME }}" \
          provided.al2023 \
          bootstrap \
          8080

    # --- Validación común ---
    - name: Smoke test
      run: bash scripts/smoke-test.sh "${{ steps.deploy_azure.outputs.url || steps.deploy_aws.outputs.url }}"

    - name: Deployment summary
      if: always()
      run: |
        URL="${{ steps.deploy_azure.outputs.url || steps.deploy_aws.outputs.url || 'pending' }}"
        if [ "${{ env.CLOUD_PROVIDER }}" == "azure" ]; then SERVICE="Azure Container Apps"; else SERVICE="AWS Lambda (Function URL)"; fi
        echo "## 🚀 Deployment Summary - Go" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Cloud Provider | ${{ env.CLOUD_PROVIDER }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Servicio | $SERVICE |" >> $GITHUB_STEP_SUMMARY
        echo "| Release | ${{ needs.release.outputs.release-tag }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Artefacto | \`${{ needs.build.outputs.artifact }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🌐 URLs de acceso" >> $GITHUB_STEP_SUMMARY
        echo "| Endpoint | URL |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY
        echo "| App Go | $URL/ |" >> $GITHUB_STEP_SUMMARY
        echo "| Health check | $URL/health |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Respuesta esperada:** \`{\"message\": \"Hola ED Team\"}\`" >> $GITHUB_STEP_SUMMARY
