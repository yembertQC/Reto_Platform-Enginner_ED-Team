name: Pull request - CI

on:
  workflow_dispatch:
  push:
    paths:
     - 'src/**'
    branches: [ main ]

  pull_request:
    paths:
     - 'src/**'
    branches: [ main ]

# Sin permisos por defecto: cada job declara solo los que necesita
permissions: {}

jobs:
  SAST:
    permissions:
      actions: read
      contents: read
      security-events: write
    name: SAST - codeql
    runs-on: ubuntu-latest

    strategy:
          fail-fast: false
          matrix:
            include:
            - language: python
              build-mode: none
            
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
  
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{matrix.language}}"
          upload: true

  SCA:
    permissions:
      contents: read
      pull-requests: write
    name: SCA - Python dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # fail-on-severity: high
          warn-only: true
          comment-summary-in-pr: true
          vulnerability-check: true

  Container_security:
    permissions:
      actions: read
      contents: read
      security-events: write
    name: Dockerfile Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Build image
        run: |
          docker build -f src/Dockerfile -t test-image src/

      - name: Image Scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: scan
        with:
          image: test-image
          fail-build: false
          severity-cutoff: high

      - name: Upload sarif
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
