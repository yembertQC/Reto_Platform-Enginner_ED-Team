name: Provision Infrastructure (Serverless)

# Azure: Container Apps Environment (app Go) y Storage Account + Function App Flex Consumption (app Python).
# AWS:   rol IAM de ejecución para Lambda.
# No se crea ningún registry: la imagen de Go vive en GitHub Container Registry (GHCR) y Lambda recibe paquetes zip.
# Las Container Apps y las funciones Lambda las crea el CD en el primer despliegue (necesitan el artefacto ya construido).

on:
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: 'Cloud provider'
        required: true
        default: 'azure'
        type: choice
        options:
        - azure
        - aws
      action:
        description: 'Action to perform'
        required: true
        default: 'create'
        type: choice
        options:
        - create
        - destroy

env:
  # Azure
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  CONTAINER_NAME_GO: ${{ vars.CONTAINER_NAME }}-go
  CONTAINERAPP_ENV_NAME: ${{ vars.CONTAINERAPP_ENV_NAME }}
  FUNCTION_APP_NAME: ${{ vars.FUNCTION_APP_NAME }}
  STORAGE_ACCOUNT_NAME: ${{ vars.STORAGE_ACCOUNT_NAME }}
  FUNCTION_PYTHON_VERSION: ${{ vars.FUNCTION_PYTHON_VERSION || '3.13' }}
  # AWS
  AWS_REGION: ${{ vars.AWS_REGION }}
  LAMBDA_NAME: ${{ vars.LAMBDA_NAME }}
  LAMBDA_ROLE_NAME: ${{ vars.LAMBDA_NAME }}-lambda-role

# Sin permisos por defecto: cada job declara solo los que necesita
permissions: {}

jobs:
  # ==============================
  # AZURE - Create Infrastructure
  # ==============================
  azure-create:
    name: Azure - Create Infrastructure
    if: ${{ inputs.cloud_provider == 'azure' && inputs.action == 'create' }}
    runs-on: ubuntu-latest

    steps:
    - name: Azure Login
      uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Create Azure Infrastructure
      run: |
        set -euo pipefail
        RG="${{ env.RESOURCE_GROUP }}"
        LOC="${{ env.AZURE_LOCATION }}"

        echo "=== CREATING AZURE SERVERLESS INFRASTRUCTURE ==="
        echo "- Resource Group:            $RG (existente)"
        echo "- Container Apps Environment: ${{ env.CONTAINERAPP_ENV_NAME }}"
        echo "- Storage Account:           ${{ env.STORAGE_ACCOUNT_NAME }}"
        echo "- Function App:              ${{ env.FUNCTION_APP_NAME }} (Python ${{ env.FUNCTION_PYTHON_VERSION }})"
        echo "- Location:                  $LOC"
        echo ""

        # 1. Resource Group (debe existir)
        if ! az group show --name "$RG" > /dev/null 2>&1; then
          echo "❌ Resource Group not found: $RG"
          az group list --query "[].{Name:name, Location:location}" -o table
          exit 1
        fi
        echo "✅ Resource Group exists: $RG"

        # 2. Proveedores de recursos (requiere permisos a nivel suscripción; si ya están registrados no hace falta)
        for NS in Microsoft.App Microsoft.Web Microsoft.Storage; do
          az provider register --namespace "$NS" --wait 2>/dev/null \
            || echo "::warning::No se pudo registrar $NS (puede que ya esté registrado o falten permisos)"
        done

        az extension add --name containerapp --upgrade --only-show-errors

        # 3. Container Apps Environment (sin Log Analytics para mantener costo y limpieza mínimos)
        if az containerapp env show --name "${{ env.CONTAINERAPP_ENV_NAME }}" --resource-group "$RG" > /dev/null 2>&1; then
          echo "⚠️ Container Apps Environment already exists: ${{ env.CONTAINERAPP_ENV_NAME }}"
        else
          az containerapp env create \
            --name "${{ env.CONTAINERAPP_ENV_NAME }}" \
            --resource-group "$RG" \
            --location "$LOC" \
            --logs-destination none \
            --only-show-errors > /dev/null
          echo "✅ Container Apps Environment created: ${{ env.CONTAINERAPP_ENV_NAME }}"
        fi

        # 4. Storage Account (requerido por Azure Functions)
        if az storage account show --name "${{ env.STORAGE_ACCOUNT_NAME }}" --resource-group "$RG" > /dev/null 2>&1; then
          echo "⚠️ Storage Account already exists: ${{ env.STORAGE_ACCOUNT_NAME }}"
        else
          az storage account create \
            --name "${{ env.STORAGE_ACCOUNT_NAME }}" \
            --resource-group "$RG" \
            --location "$LOC" \
            --sku Standard_LRS \
            --allow-blob-public-access false \
            --only-show-errors > /dev/null
          echo "✅ Storage Account created: ${{ env.STORAGE_ACCOUNT_NAME }}"
        fi

        # 5. Function App en plan Flex Consumption (app Python)
        if az functionapp show --name "${{ env.FUNCTION_APP_NAME }}" --resource-group "$RG" > /dev/null 2>&1; then
          echo "⚠️ Function App already exists: ${{ env.FUNCTION_APP_NAME }}"
        else
          az functionapp create \
            --name "${{ env.FUNCTION_APP_NAME }}" \
            --resource-group "$RG" \
            --storage-account "${{ env.STORAGE_ACCOUNT_NAME }}" \
            --flexconsumption-location "$LOC" \
            --runtime python \
            --runtime-version "${{ env.FUNCTION_PYTHON_VERSION }}" \
            --disable-app-insights true \
            --only-show-errors > /dev/null
          echo "✅ Function App created: ${{ env.FUNCTION_APP_NAME }}"
        fi

        echo ""
        echo "=== AZURE INFRASTRUCTURE CREATED SUCCESSFULLY ==="

    - name: Generate Azure Summary
      run: |
        RG="${{ env.RESOURCE_GROUP }}"
        CAE_DOMAIN=$(az containerapp env show --name "${{ env.CONTAINERAPP_ENV_NAME }}" --resource-group "$RG" --query properties.defaultDomain -o tsv)
        FUNC_HOST=$(az functionapp show --name "${{ env.FUNCTION_APP_NAME }}" --resource-group "$RG" --query properties.defaultHostName -o tsv)

        echo "## 🎉 Azure Serverless Infrastructure Created" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Resource Group | \`$RG\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Container Apps Environment | \`${{ env.CONTAINERAPP_ENV_NAME }}\` (\`$CAE_DOMAIN\`) |" >> $GITHUB_STEP_SUMMARY
        echo "| Storage Account | \`${{ env.STORAGE_ACCOUNT_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Function App | \`https://$FUNC_HOST\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Location | ${{ env.AZURE_LOCATION }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔧 Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. Variable \`CLOUD_PROVIDER\` = \`azure\`" >> $GITHUB_STEP_SUMMARY
        echo "2. Push a \`src/\` (Python → Azure Functions) o \`src-go/\` (Go → Container App \`${{ env.CONTAINER_NAME_GO }}\`), o lanzar los CD manualmente" >> $GITHUB_STEP_SUMMARY
        echo "3. Tras el primer CD de Go, haz **público** el paquete \`${{ env.CONTAINER_NAME_GO }}\` de GHCR (una sola vez) para que Container Apps lo descargue sin credenciales" >> $GITHUB_STEP_SUMMARY

  # ===============================
  # AZURE - Destroy Infrastructure
  # ===============================
  azure-destroy:
    name: Azure - Destroy Infrastructure
    if: ${{ inputs.cloud_provider == 'azure' && inputs.action == 'destroy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Azure Login
      uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # Misma lógica que destroy-all.yml; conserva el Resource Group y las imágenes de GHCR
    - name: Destroy Azure Infrastructure
      run: |
        bash scripts/destroy-azure.sh \
          "${{ env.RESOURCE_GROUP }}" \
          "${{ env.CONTAINER_NAME_GO }}" \
          "${{ env.CONTAINERAPP_ENV_NAME }}" \
          "${{ env.FUNCTION_APP_NAME }}" \
          "${{ env.STORAGE_ACCOUNT_NAME }}"

  # ===========================
  # AWS - Create Infrastructure
  # ===========================
  aws-create:
    name: AWS - Create Infrastructure
    if: ${{ inputs.cloud_provider == 'aws' && inputs.action == 'create' }}
    runs-on: ubuntu-latest

    steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Create AWS Infrastructure
      run: |
        set -euo pipefail
        echo "=== CREATING AWS SERVERLESS INFRASTRUCTURE ==="
        echo "- IAM role: ${{ env.LAMBDA_ROLE_NAME }}"
        echo "- Region: ${{ env.AWS_REGION }}"
        echo ""

        # Rol de ejecución para Lambda (solo logs en CloudWatch).
        # No hay repositorios ECR: las Lambdas se despliegan como paquetes zip.
        if aws iam get-role --role-name "${{ env.LAMBDA_ROLE_NAME }}" > /dev/null 2>&1; then
          echo "⚠️ IAM role already exists: ${{ env.LAMBDA_ROLE_NAME }}"
        else
          aws iam create-role \
            --role-name "${{ env.LAMBDA_ROLE_NAME }}" \
            --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}' > /dev/null
          aws iam attach-role-policy \
            --role-name "${{ env.LAMBDA_ROLE_NAME }}" \
            --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
          echo "✅ IAM role created: ${{ env.LAMBDA_ROLE_NAME }}"
          echo "⏳ Waiting for IAM role propagation..."
          sleep 15
        fi

        echo ""
        echo "=== AWS INFRASTRUCTURE CREATED SUCCESSFULLY ==="

    - name: Generate AWS Summary
      run: |
        echo "## 🎉 AWS Serverless Infrastructure Created" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Resource | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Lambda execution role | \`${{ env.LAMBDA_ROLE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Region | ${{ env.AWS_REGION }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔧 Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. Variable \`CLOUD_PROVIDER\` = \`aws\`" >> $GITHUB_STEP_SUMMARY
        echo "2. Push a \`src/\` o \`src-go/\` (o lanzar los CD manualmente): el primer despliegue crea las Lambdas \`${{ env.LAMBDA_NAME }}\` y \`${{ env.LAMBDA_NAME }}-go\` con su Function URL" >> $GITHUB_STEP_SUMMARY

  # ============================
  # AWS - Destroy Infrastructure
  # ============================
  aws-destroy:
    name: AWS - Destroy Infrastructure
    if: ${{ inputs.cloud_provider == 'aws' && inputs.action == 'destroy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    # Misma lógica que destroy-all.yml
    - name: Destroy AWS Infrastructure
      run: bash scripts/destroy-aws.sh "${{ env.LAMBDA_NAME }}" "${{ env.LAMBDA_ROLE_NAME }}"
