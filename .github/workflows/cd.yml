name: CD - Python (Serverless)

# Azure -> Azure Functions (Flex Consumption), código Python con la app Flask montada vía WSGI.
# AWS   -> AWS Lambda con paquete zip (python3.13) + Lambda Web Adapter como layer, expuesta con Function URL.
# Ninguno de los dos usa un registry de contenedores.
# El cloud destino lo decide la variable de repositorio CLOUD_PROVIDER.

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
    branches: [ main ]

# Sin permisos por defecto: cada job declara solo los que necesita
permissions: {}

env:
  CLOUD_PROVIDER: ${{ vars.CLOUD_PROVIDER }}
  # Azure
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  FUNCTION_APP_NAME: ${{ vars.FUNCTION_APP_NAME }}
  # AWS
  AWS_REGION: ${{ vars.AWS_REGION }}
  LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_NAME }}
  LAMBDA_ROLE_NAME: ${{ vars.LAMBDA_NAME }}-lambda-role
  LAMBDA_RUNTIME: python3.13

jobs:
  build:
    permissions:
      contents: read
    name: Build
    runs-on: ubuntu-latest
    outputs:
      sha-short: ${{ steps.sha_short.outputs.sha_short }}
      artifact: ${{ steps.artifact_info.outputs.artifact }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Validate CLOUD_PROVIDER
      run: |
        case "${{ env.CLOUD_PROVIDER }}" in
          azure|aws) echo "Cloud destino: ${{ env.CLOUD_PROVIDER }}" ;;
          *) echo "❌ CLOUD_PROVIDER debe ser 'azure' o 'aws' (valor actual: '${{ env.CLOUD_PROVIDER }}')"; exit 1 ;;
        esac

    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'
        cache: 'pip'
        cache-dependency-path: src/requirements.txt

    - name: Install dependencies and check imports
      working-directory: src
      run: |
        pip install -r requirements.txt
        python -c "import app, function_app; print('✅ app y function_app importan correctamente')"

    - name: Set SHA Short
      id: sha_short
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # --- Azure: paquete zip para Azure Functions (las dependencias se instalan con remote build) ---
    - name: Package Azure Function
      if: env.CLOUD_PROVIDER == 'azure'
      working-directory: src
      run: |
        zip -r ../function-app.zip . -x 'Dockerfile' '.funcignore' 'run.sh' '__pycache__/*' '*.pyc'
        unzip -l ../function-app.zip

    - name: Upload Azure Function package
      if: env.CLOUD_PROVIDER == 'azure'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: function-app
        path: function-app.zip
        retention-days: 7

    # --- AWS: paquete zip para Lambda (dependencias incluidas, sin registry) ---
    - name: Package AWS Lambda
      if: env.CLOUD_PROVIDER == 'aws'
      run: |
        mkdir -p build/lambda
        # Wheels de Linux x86_64 para el runtime de Lambda, aunque el runner fuese otra plataforma.
        python -m pip install --target build/lambda \
          --platform manylinux2014_x86_64 --implementation cp --python-version 3.13 \
          --only-binary=:all: -r src/requirements.txt
        cp src/app.py src/run.sh build/lambda/
        chmod +x build/lambda/run.sh
        (cd build/lambda && zip -qr ../../lambda-python.zip .)
        ls -lh lambda-python.zip

    - name: Upload AWS Lambda package
      if: env.CLOUD_PROVIDER == 'aws'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: lambda-python
        path: lambda-python.zip
        retention-days: 7

    - name: Set artifact output
      id: artifact_info
      run: |
        if [ "${{ env.CLOUD_PROVIDER }}" == "azure" ]; then
          echo "artifact=function-app.zip (Azure Functions, Python)" >> $GITHUB_OUTPUT
        else
          echo "artifact=lambda-python.zip (AWS Lambda ${{ env.LAMBDA_RUNTIME }})" >> $GITHUB_OUTPUT
        fi

  release:
    permissions:
      contents: write
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    outputs:
      release-tag: ${{ steps.create_release.outputs.tag_name }}

    steps:
    - name: Generate release tag
      id: tag_version
      run: |
        TAG="v$(date +'%Y%m%d')-${{ needs.build.outputs.sha-short }}"
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "Generated release tag: $TAG"

    - name: Create GitHub Release
      id: create_release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.tag_version.outputs.tag }}
        # Los datos van por env (no interpolados en el script) para evitar inyección
        NOTES: |
            ## 🚀 Reto Platform Engineering · Despliegue Python (Serverless)

            ### 📋 Build Information:
            - **Artifact**: `${{ needs.build.outputs.artifact }}`
            - **Commit**: ${{ github.sha }}
            - **Short SHA**: ${{ needs.build.outputs.sha-short }}
            - **Author**: ${{ github.actor }}
            - **Cloud Provider**: ${{ env.CLOUD_PROVIDER }}

            ### 🔗 Links:
            - [Commit Details](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - [Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
      run: |
        gh release create "$TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "Release $TAG" \
          --notes "$NOTES" \
          --generate-notes
        echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

  deploy:
    permissions:
      contents: read
    name: Deploy (Serverless)
    needs: [build, release]
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # --- Azure Functions ---
    - name: Download Azure Function package
      if: env.CLOUD_PROVIDER == 'azure'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: function-app

    - name: Azure Login
      if: env.CLOUD_PROVIDER == 'azure'
      uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Functions
      if: env.CLOUD_PROVIDER == 'azure'
      id: deploy_azure
      run: |
        az functionapp deployment source config-zip \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.FUNCTION_APP_NAME }} \
          --src function-app.zip \
          --build-remote true

        # En Flex Consumption el host está en properties.defaultHostName (defaultHostName viene vacío)
        HOST=$(az functionapp show \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.FUNCTION_APP_NAME }} \
          --query properties.defaultHostName -o tsv)
        if [ -z "$HOST" ]; then
          echo "::error::No se pudo obtener el host de la Function App ${{ env.FUNCTION_APP_NAME }}"
          exit 1
        fi
        echo "url=https://$HOST" >> $GITHUB_OUTPUT
        echo "✅ Azure Function desplegada: https://$HOST"

    # --- AWS Lambda ---
    - name: Download AWS Lambda package
      if: env.CLOUD_PROVIDER == 'aws'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: lambda-python

    - name: Configure AWS Credentials
      if: env.CLOUD_PROVIDER == 'aws'
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy to AWS Lambda
      if: env.CLOUD_PROVIDER == 'aws'
      id: deploy_aws
      run: |
        bash scripts/deploy-lambda.sh \
          "${{ env.LAMBDA_FUNCTION_NAME }}" \
          lambda-python.zip \
          "${{ env.LAMBDA_ROLE_NAME }}" \
          "${{ env.LAMBDA_RUNTIME }}" \
          run.sh \
          5000

    # --- Validación común ---
    - name: Smoke test
      run: bash scripts/smoke-test.sh "${{ steps.deploy_azure.outputs.url || steps.deploy_aws.outputs.url }}"

    - name: Deployment summary
      if: always()
      run: |
        URL="${{ steps.deploy_azure.outputs.url || steps.deploy_aws.outputs.url || 'pending' }}"
        if [ "${{ env.CLOUD_PROVIDER }}" == "azure" ]; then SERVICE="Azure Functions (Flex Consumption)"; else SERVICE="AWS Lambda (Function URL)"; fi
        echo "## 🚀 Deployment Summary - Python" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| Cloud Provider | ${{ env.CLOUD_PROVIDER }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Servicio | $SERVICE |" >> $GITHUB_STEP_SUMMARY
        echo "| Release | ${{ needs.release.outputs.release-tag }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Artefacto | \`${{ needs.build.outputs.artifact }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🌐 URLs de acceso" >> $GITHUB_STEP_SUMMARY
        echo "| Endpoint | URL |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY
        echo "| App Python | $URL/ |" >> $GITHUB_STEP_SUMMARY
        echo "| Health check | $URL/health |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Respuesta esperada:** \`{\"message\": \"Hola ED Team\"}\`" >> $GITHUB_STEP_SUMMARY
