# pipelines/.github/workflows/build.yml — el golden path de la organización.
# Solución de M1 · Clase 4: el alumno lo genera con Copilot desde cd-go.yml y lo corrige.
# Contrato: tres datos (service, language, environment) y version opcional. La nube y la región NO las elige quien llama:
# salen de las variables del repo que puso platformctl (CLOUD_PROVIDER, AZURE_LOCATION o AWS_REGION),
# o de las de la organización si el repo no las tiene.
#
#   language   azure                                        aws
#   go         imagen en GHCR → Container Apps              binario "bootstrap" en zip → Lambda provided.al2023
#   python     imagen en GHCR → Container Apps              app.py + deps + run.sh en zip → Lambda python3.13
#
# Sale de cd-go.yml y cd.yml del repo del reto. scripts/ lo copia bootstrap.sh desde el reto.
name: Build y deploy

on:
  workflow_call:
    inputs:
      service:
        description: Nombre del servicio (el del repo)
        type: string
        required: true
      language:
        description: go | python
        type: string
        default: go
      environment:
        description: dev | production. Environment de GitHub del job de deploy; production puede exigir aprobación
        type: string
        default: dev
      version:
        description: Versión que va en el tag de la imagen (<version>-<sha corto>)
        type: string
        default: 1.0.0

permissions: {}

env:
  CLOUD_PROVIDER: ${{ vars.CLOUD_PROVIDER }}
  LANGUAGE: ${{ inputs.language }}
  # <servicio>-dev o <servicio>-prod: cabe en los 32 caracteres de una Container App con nombres de hasta 27
  APP_NAME: ${{ inputs.service }}-${{ inputs.environment == 'production' && 'prod' || inputs.environment }}
  PORT: '8080'
  # Solo se publica y despliega desde main; un pull request construye y prueba.
  DEPLOY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  build:
    name: Build y tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # publicar la imagen en GHCR con GITHUB_TOKEN
    outputs:
      artifact: ${{ steps.artifact.outputs.artifact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validar contrato
        run: |
          case "$LANGUAGE" in go|python) ;; *) echo "::error::language debe ser go o python (llegó '$LANGUAGE')"; exit 1 ;; esac
          case "$CLOUD_PROVIDER" in azure|aws) ;; *) echo "::error::CLOUD_PROVIDER debe ser azure o aws (llegó '$CLOUD_PROVIDER')"; exit 1 ;; esac
          [[ "$APP_NAME" =~ ^[a-z][a-z0-9-]{1,30}[a-z0-9]$ ]] || { echo "::error::'$APP_NAME' no cumple la convención de nombres (máx. 32)"; exit 1; }
          echo "Servicio $APP_NAME · $LANGUAGE · $CLOUD_PROVIDER · despliega: $DEPLOY"

      # --- Tests ---
      - if: env.LANGUAGE == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - if: env.LANGUAGE == 'go'
        run: go test -v -race ./...

      - if: env.LANGUAGE == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
      - if: env.LANGUAGE == 'python'
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      # --- Azure: imagen en GHCR (los dos lenguajes) ---
      - if: env.CLOUD_PROVIDER == 'azure' && env.DEPLOY == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagen
        if: env.CLOUD_PROVIDER == 'azure'
        env:
          VERSION: ${{ inputs.version }}
          SERVICE: ${{ inputs.service }}
        run: |
          # GHCR exige el owner en minúsculas. Un paquete por servicio, de la organización.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${SERVICE}:${VERSION}-${GITHUB_SHA::7}"
          docker build --platform linux/amd64 --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "$IMAGE" .
          if [ "$DEPLOY" = "true" ]; then docker push "$IMAGE"; fi
          echo "ARTIFACT=$IMAGE" >> "$GITHUB_ENV"

      # --- AWS: zip para Lambda ---
      - name: Paquete Lambda (Go)
        if: env.CLOUD_PROVIDER == 'aws' && env.LANGUAGE == 'go'
        run: |
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/bootstrap .
          (cd build && zip -q ../lambda.zip bootstrap)
          echo "ARTIFACT=lambda.zip" >> "$GITHUB_ENV"
      - name: Paquete Lambda (Python)
        if: env.CLOUD_PROVIDER == 'aws' && env.LANGUAGE == 'python'
        run: |
          mkdir -p build/lambda
          # Wheels de Linux x86_64 para el runtime de Lambda
          python -m pip install --target build/lambda \
            --platform manylinux2014_x86_64 --implementation cp --python-version 3.13 \
            --only-binary=:all: -r requirements.txt
          cp app.py run.sh build/lambda/
          chmod +x build/lambda/run.sh
          (cd build/lambda && zip -qr ../../lambda.zip .)
          echo "ARTIFACT=lambda.zip" >> "$GITHUB_ENV"
      - if: env.CLOUD_PROVIDER == 'aws' && env.DEPLOY == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lambda
          path: lambda.zip
          retention-days: 7

      - id: artifact
        run: echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      # Los scripts viven en este repo (pipelines), no en el del servicio.
      # Se fija la misma versión mayor que usa quien llama: v1.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/pipelines
          ref: v1
          path: pipelines

      # --- Azure Container Apps ---
      - if: env.CLOUD_PROVIDER == 'azure'
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}   # en M2 · Clase 3 pasa a OIDC
      - id: azure
        if: env.CLOUD_PROVIDER == 'azure'
        env:
          IMAGE: ${{ needs.build.outputs.artifact }}
          RG: ${{ vars.RESOURCE_GROUP }}
          CAE: ${{ vars.CONTAINERAPP_ENV_NAME }}
          # Tamaño que pidió el issue (lo puso platformctl como variables del repo)
          CONTAINERAPP_CPU: ${{ vars.CONTAINERAPP_CPU }}
          CONTAINERAPP_MEMORY: ${{ vars.CONTAINERAPP_MEMORY }}
          # Credencial de solo lectura de la organización: el paquete de GHCR se queda privado
          GHCR_PULL_USER: ${{ vars.GHCR_PULL_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: bash pipelines/scripts/deploy-containerapp.sh "$APP_NAME" "$RG" "$CAE" "$IMAGE" "$PORT"

      # --- AWS Lambda ---
      - if: env.CLOUD_PROVIDER == 'aws'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: lambda
      - if: env.CLOUD_PROVIDER == 'aws'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: aws
        if: env.CLOUD_PROVIDER == 'aws'
        env:
          ROLE: ${{ vars.LAMBDA_ROLE_NAME }}
          LAMBDA_MEMORY: ${{ vars.LAMBDA_MEMORY }}
        run: |
          if [ "$LANGUAGE" = "go" ]; then RUNTIME=provided.al2023; HANDLER=bootstrap; else RUNTIME=python3.13; HANDLER=run.sh; fi
          bash pipelines/scripts/deploy-lambda.sh "$APP_NAME" lambda.zip "$ROLE" "$RUNTIME" "$HANDLER" "$PORT"

      # --- Común ---
      - name: Smoke test
        env:
          URL: ${{ steps.azure.outputs.url || steps.aws.outputs.url }}
        run: bash pipelines/scripts/smoke-test.sh "$URL"
      - name: Resumen
        if: always()
        env:
          URL: ${{ steps.azure.outputs.url || steps.aws.outputs.url || 'sin URL' }}
          ARTIFACT: ${{ needs.build.outputs.artifact }}
        run: |
          {
            echo "## 🚀 $APP_NAME"
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Lenguaje | $LANGUAGE |"
            echo "| Nube | $CLOUD_PROVIDER |"
            echo "| Ambiente | ${{ inputs.environment }} |"
            echo "| Artefacto | \`$ARTIFACT\` |"
            echo "| URL | $URL |"
            echo "| Health | $URL/health |"
          } >> "$GITHUB_STEP_SUMMARY"
